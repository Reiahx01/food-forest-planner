name: CI

on:
  # Runs only on merges to main (and manual dispatch). Per-PR CI was
  # intentionally removed -- the local pre-push battery
  # (typecheck + lint + test + build) is the contributor-side gate, and CI
  # acts as the post-merge integration check. The DCO workflow
  # (.github/workflows/dco.yml) still gates PRs because it's cheap and
  # carries no compute cost worth optimizing.
  push:
    branches: [main]
  workflow_dispatch:

# Cancel older runs on the same ref when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Vitest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Vitest (integration, real Supabase)
    runs-on: ubuntu-latest
    # ADR-0001 + #4: integration tests run against the local Supabase stack
    # rather than pg-mem. Same Postgres major version, same RLS engine, same
    # PostGIS as prod -- the only difference is who's hosting the box.
    #
    # Docker image cache (this PR): `supabase start` pulls ~10 images
    # (postgres+postgis, gotrue, postgrest, storage-api, realtime, studio,
    # inbucket, kong, edge-runtime, postgres-meta). Without caching that's
    # ~3-5 min of network on every run. We `docker save` them to a tar
    # bundle once and `docker load` on subsequent runs. The cache key is
    # bound to `package-lock.json` (CLI version pin -> image tags) and
    # `supabase/config.toml` (postgres major_version pin), so any version
    # bump invalidates cleanly.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Restore Supabase Docker image cache
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images
          key: supabase-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'supabase/config.toml') }}
          restore-keys: |
            supabase-images-${{ runner.os }}-

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          shopt -s nullglob
          for tar in /tmp/supabase-images/*.tar; do
            echo "::group::docker load $tar"
            docker load -i "$tar"
            echo "::endgroup::"
          done

      - name: Start local Supabase (Postgres + PostGIS + Auth + Storage)
        run: npx supabase start --workdir .

      - name: Save Supabase Docker images for the next run
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/supabase-images
          # Save every supabase-pulled image. Filter by the registry prefixes
          # the CLI uses so we don't bloat the cache with unrelated images
          # the runner happens to have pre-baked.
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^(public\.ecr\.aws/supabase/|supabase/|postgrest/|inbucket/|kong:|library/kong)' \
            | while read -r img; do
                safe=$(echo "$img" | tr '/:' '__')
                echo "::group::docker save $img"
                docker save "$img" -o "/tmp/supabase-images/${safe}.tar"
                echo "::endgroup::"
              done
          du -sh /tmp/supabase-images || true

      - name: Capture local Supabase credentials into the job env
        run: |
          status=$(npx supabase status -o env)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | grep '^API_URL='          | cut -d= -f2- | tr -d '\"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | grep '^ANON_KEY='    | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "DATABASE_URL=$(echo "$status" | grep '^DB_URL='                       | cut -d= -f2- | tr -d '\"')"
          } >> "$GITHUB_ENV"
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify PostGIS is enabled (acceptance criterion from #4)
        run: psql "$DATABASE_URL" -c "SELECT PostGIS_Version();"
      - name: Run integration tests
        env:
          IS_INTEGRATION: "1"
        run: npm test
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --workdir . --no-backup

  build:
    name: Next build (SSG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
