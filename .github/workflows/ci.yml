name: CI

on:
  # Runs only on merges to main (and manual dispatch). Per-PR CI was
  # intentionally removed -- the local pre-push battery
  # (typecheck + lint + test + build) is the contributor-side gate, and CI
  # acts as the post-merge integration check. The DCO workflow
  # (.github/workflows/dco.yml) still gates PRs because it's cheap and
  # carries no compute cost worth optimizing.
  push:
    branches: [main]
  workflow_dispatch:

# Cancel older runs on the same ref when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Vitest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Vitest (integration, real Supabase)
    runs-on: ubuntu-latest
    # ADR-0001 + #4: integration tests run against the local Supabase stack
    # rather than pg-mem. Same Postgres major version, same RLS engine, same
    # PostGIS as prod -- the only difference is who's hosting the box.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start local Supabase (Postgres + PostGIS + Auth + Storage)
        run: npx supabase start --workdir .
      - name: Capture local Supabase credentials into the job env
        run: |
          # `supabase status -o env` prints `KEY="value"` pairs. Filter to the
          # ones our code reads, then append to GITHUB_ENV so subsequent steps
          # see them. The DB URL is constructed from the printed db.port.
          npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' >> "$GITHUB_ENV"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(npx supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(npx supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(npx supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "DATABASE_URL=$(npx supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')"
          } >> "$GITHUB_ENV"
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify PostGIS is enabled (acceptance criterion from #4)
        run: |
          PGPASSWORD=postgres psql "$DATABASE_URL" -c "SELECT PostGIS_Version();"
      - name: Run integration tests
        env:
          IS_INTEGRATION: "1"
        run: npm test
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --workdir . --no-backup

  build:
    name: Next build (SSG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
