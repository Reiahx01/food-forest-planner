name: CI

on:
  # Runs only on merges to main (and manual dispatch). Per-PR CI was
  # intentionally removed -- the local pre-push battery
  # (typecheck + lint + test + build) is the contributor-side gate, and CI
  # acts as the post-merge integration check. The DCO workflow
  # (.github/workflows/dco.yml) still gates PRs because it's cheap and
  # carries no compute cost worth optimizing.
  push:
    branches: [main]
  workflow_dispatch:

# Cancel older runs on the same ref when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Vitest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Vitest (integration, real Supabase)
    runs-on: ubuntu-latest
    # ADR-0001 + #4: integration tests run against the local Supabase stack
    # rather than pg-mem. Same Postgres major version, same RLS engine, same
    # PostGIS as prod -- the only difference is who's hosting the box.
    #
    # Docker image cache (this PR): `supabase start` pulls ~10 images
    # (postgres+postgis, gotrue, postgrest, storage-api, realtime, studio,
    # inbucket, kong, edge-runtime, postgres-meta). Without caching that's
    # ~3-5 min of network on every run. We `docker save` them to a tar
    # bundle once and `docker load` on subsequent runs. The cache key is
    # bound to `package-lock.json` (CLI version pin -> image tags) and
    # `supabase/config.toml` (postgres major_version pin), so any version
    # bump invalidates cleanly.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Restore Supabase Docker image cache
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images
          key: supabase-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'supabase/config.toml') }}
          restore-keys: |
            supabase-images-${{ runner.os }}-

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          shopt -s nullglob
          for tar in /tmp/supabase-images/*.tar; do
            echo "::group::docker load $tar"
            docker load -i "$tar"
            echo "::endgroup::"
          done

      - name: Start local Supabase (Postgres + PostGIS + Auth + Storage)
        run: npx supabase start --workdir .

      - name: Save Supabase Docker images for the next run
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/supabase-images
          # Save every supabase-pulled image. Filter by the registry prefixes
          # the CLI uses so we don't bloat the cache with unrelated images
          # the runner happens to have pre-baked.
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^(public\.ecr\.aws/supabase/|supabase/|postgrest/|inbucket/|kong:|library/kong)' \
            | while read -r img; do
                safe=$(echo "$img" | tr '/:' '__')
                echo "::group::docker save $img"
                docker save "$img" -o "/tmp/supabase-images/${safe}.tar"
                echo "::endgroup::"
              done
          du -sh /tmp/supabase-images || true

      - name: Capture local Supabase credentials into the job env
        run: |
          status=$(npx supabase status -o env)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | grep '^API_URL='          | cut -d= -f2- | tr -d '\"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | grep '^ANON_KEY='    | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "DATABASE_URL=$(echo "$status" | grep '^DB_URL='                       | cut -d= -f2- | tr -d '\"')"
          } >> "$GITHUB_ENV"
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify PostGIS is enabled (acceptance criterion from #4)
        run: psql "$DATABASE_URL" -c "SELECT PostGIS_Version();"
      - name: Run integration tests
        env:
          IS_INTEGRATION: "1"
        run: npm test
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --workdir . --no-backup

  build:
    name: Next build (SSG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker image (self-hoster guard)
    runs-on: ubuntu-latest
    # Guards the Dockerfile against rot. Vercel is the default deploy
    # target (ADR-0001), but the Dockerfile is the load-bearing artifact
    # for AGPL self-hosters -- if it breaks silently between merges,
    # external operators discover that, not us. This job catches it.
    #
    # We build with BuildKit + the GitHub Actions cache backend
    # (`type=gha,mode=max`) so warm builds finish in <30s after the
    # first cold run populates the cache. Image is not pushed -- no
    # registry is wired yet; a future release-tag workflow will push
    # `ghcr.io/<owner>/food-forest-planner:<tag>` from the v0.1.0
    # release milestone (#28).
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: food-forest-planner:ci
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,scope=docker-build,mode=max
      - name: Smoke-test the image entrypoint
        # `docker create` + `inspect` confirms `server.js` is present and
        # the configured CMD parses, without actually starting the server
        # (which would need real Supabase env vars). Catches the common
        # regressions: missing `.next/standalone`, wrong `WORKDIR`, the
        # `nextjs` user UID not existing, broken multi-stage COPY paths.
        run: |
          id=$(docker create food-forest-planner:ci)
          docker inspect "$id" --format '{{json .Config.Cmd}}'
          docker export "$id" | tar -tf - | grep -E '^server\.js$|^\.next/static/' | head -5
          docker rm "$id" >/dev/null

  e2e:
    name: Playwright (signup happy-path)
    runs-on: ubuntu-latest
    # Closes the #5 acceptance criterion deferred from PR #38. End-to-end:
    # /signup -> Supabase Auth -> Mailpit (local email capture) ->
    # /auth/callback -> /dashboard. Single chromium project; #24 expands to
    # the full multi-browser + axe-core matrix.
    #
    # Reuses the Supabase Docker image cache from the integration job, plus
    # a separate cache for the Playwright browser binaries (~150 MB cold).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Restore Supabase Docker image cache
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images
          key: supabase-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'supabase/config.toml') }}
          restore-keys: |
            supabase-images-${{ runner.os }}-

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          shopt -s nullglob
          for tar in /tmp/supabase-images/*.tar; do
            docker load -i "$tar"
          done

      - name: Start local Supabase
        run: npx supabase start --workdir .

      - name: Capture local Supabase credentials
        run: |
          status=$(npx supabase status -o env)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | grep '^API_URL='           | cut -d= -f2- | tr -d '\"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | grep '^ANON_KEY='     | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "DATABASE_URL=$(echo "$status" | grep '^DB_URL='                        | cut -d= -f2- | tr -d '\"')"
            echo "NEXT_PUBLIC_SITE_ORIGIN=http://localhost:3000"
            # Supabase ships Mailpit under the legacy container name
            # `supabase_inbucket_*`. Keep both env names for tooling that
            # reads either; the helper prefers MAILPIT_BASE_URL.
            echo "MAILPIT_BASE_URL=http://127.0.0.1:54324"
            echo "INBUCKET_BASE_URL=http://127.0.0.1:54324"
          } >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npm run db:migrate

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps when binaries were cached
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Smoke-test the Supabase -> Mailpit SMTP wiring
        # Independent of any app code: hits the public `/auth/v1/otp` endpoint
        # (the same one supabase-js `signInWithOtp` calls) and polls Mailpit's
        # REST API for the recipient.
        #
        # IMPORTANT (post-PR-#41 finding): Supabase's "Inbucket" container is
        # now Mailpit. The legacy `supabase_inbucket_*` container name + 54324
        # port are kept for backward compat, but the REST API is Mailpit's:
        #   GET /api/v1/search?query=to:<addr>
        #   GET /api/v1/messages
        #   GET /api/v1/message/<id>
        # (Inbucket's `/api/v1/mailbox/<name>` returns 404 because it doesn't
        # exist in Mailpit -- which is why every previous smoke attempt
        # mis-attributed delivery failures.)
        #
        # ALSO: `/auth/v1/admin/generate_link` generates a link but does NOT
        # send email (the `confirmation_sent_at` in its response is a user-
        # creation timestamp, not an SMTP-send timestamp). We use the public
        # OTP endpoint instead, which definitively triggers an SMTP send.
        run: |
          set -euo pipefail
          smoke_email="smoke-$(date +%s)@test.local"
          echo "Triggering signInWithOtp for ${smoke_email} via /auth/v1/otp..."
          curl -sS -o /tmp/otp-resp.json -w "HTTP %{http_code}\n" \
            -X POST "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/otp" \
            -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${smoke_email}\",\"create_user\":true}" || true
          echo "--- /auth/v1/otp response ---"
          cat /tmp/otp-resp.json || true
          echo "--- end ---"
          query_url=$(printf 'http://127.0.0.1:54324/api/v1/search?query=to:%s' "$smoke_email")
          echo "Polling Mailpit search at $query_url ..."
          for i in $(seq 1 30); do
            response=$(curl -sf "$query_url" 2>/dev/null || echo '{"messages":[]}')
            count=$(echo "$response" | python3 -c 'import sys,json; data=json.load(sys.stdin); print(len(data.get("messages") or []))' 2>/dev/null || echo "0")
            if [ "$count" -gt 0 ]; then
              echo "SMTP delivery to Mailpit works (${i}s, ${count} message(s))."
              echo "$response" | python3 -m json.tool || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::SMTP smoke test failed -- no email landed in Mailpit within 30s."
          echo "::group::Mailpit /api/v1/messages snapshot"
          curl -sf "http://127.0.0.1:54324/api/v1/messages" | python3 -m json.tool || echo "(unreachable)"
          echo "::endgroup::"
          echo "::group::Listing all containers"
          docker ps --format '{{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "::endgroup::"
          for service in supabase_auth supabase_inbucket; do
            echo "::group::${service} log (last 150 lines)"
            docker ps --filter "name=${service}" --format '{{.Names}}' \
              | head -1 \
              | xargs -r -I{} docker logs --tail 150 {} 2>&1 \
              || echo "(no ${service} container found)"
            echo "::endgroup::"
          done
          exit 1

      - name: Build the Next app
        run: npm run build

      - name: Start the Next app in the background
        run: |
          nohup npm run start > /tmp/next-server.log 2>&1 &
          # Wait for the server to be ready.
          for i in {1..60}; do
            if curl -fs http://localhost:3000/ > /dev/null; then
              echo "next server up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:3000/ > /dev/null

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Print Next server log on failure
        if: failure()
        run: tail -200 /tmp/next-server.log || true

      - name: Dump Mailpit + Supabase Auth state on failure
        if: failure()
        run: |
          echo "::group::Mailpit messages (latest)"
          curl -sf http://127.0.0.1:54324/api/v1/messages | python3 -m json.tool || echo "(unreachable)"
          echo "::endgroup::"
          echo "::group::Mailpit service log (last 200 lines)"
          docker ps --filter "name=supabase_inbucket" --format '{{.Names}}' | head -1 | xargs -r -I{} docker logs --tail 200 {}
          echo "::endgroup::"
          echo "::group::Supabase Auth service log (last 200 lines)"
          docker ps --filter "name=supabase_auth" --format '{{.Names}}' | head -1 | xargs -r -I{} docker logs --tail 200 {}
          echo "::endgroup::"

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --workdir . --no-backup
