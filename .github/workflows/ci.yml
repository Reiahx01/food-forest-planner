name: CI

on:
  # Runs only on merges to main (and manual dispatch). Per-PR CI was
  # intentionally removed -- the local pre-push battery
  # (typecheck + lint + test + build) is the contributor-side gate, and CI
  # acts as the post-merge integration check. The DCO workflow
  # (.github/workflows/dco.yml) still gates PRs because it's cheap and
  # carries no compute cost worth optimizing.
  push:
    branches: [main]
  workflow_dispatch:

# Cancel older runs on the same ref when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Vitest (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      # NOTE: integration tests against ephemeral Supabase land in issue #4.
      # When they do, add `npx supabase start` before `npm test` and
      # `npx supabase stop` after.

  build:
    name: Next build (SSG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
